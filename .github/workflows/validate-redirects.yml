name: Validate Redirects

on:
  pull_request:

jobs:
  validate:
    name: Validate redirect regexes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Run redirect validator
        run: node ./scripts/validate-redirects.js
